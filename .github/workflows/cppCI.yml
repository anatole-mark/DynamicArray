name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: configure
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
    - name: build
      run: cmake --build build --parallel
    - name: test
      working-directory: build
      run: ctest --output-on-failure
      
